<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم تأكيد طلبك | LogoName</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-hero);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .success-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15; }
        .success-orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; right: -100px; }
        .success-orb-2 { width: 300px; height: 300px; background: var(--success); bottom: -50px; left: -50px; }

        .success-card {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 3rem 2.5rem;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .success-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(16,185,129,0.15);
            border: 2px solid rgba(16,185,129,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            animation: popIn 0.6s ease 0.2s both;
        }

        .success-icon .material-symbols-outlined {
            font-size: 3rem;
            color: #10B981;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .success-subtitle { color: var(--text-muted); margin-bottom: 2rem; }

        .order-number-box {
            background: rgba(124,58,237,0.1);
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: var(--radius-md);
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
        }

        .order-number-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; }
        .order-number-value { font-size: 1.4rem; font-weight: 800; color: var(--primary-light); letter-spacing: 1px; }

        .order-details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 2rem; }
        .detail-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 0.9rem; text-align: start; }
        .detail-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.25rem; }
        .detail-value { font-size: 0.875rem; font-weight: 600; }

        .cta-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>

<div class="success-page">
    <div class="success-orb success-orb-1"></div>
    <div class="success-orb success-orb-2"></div>

    <div class="success-card">
        <div class="success-icon">
            <span class="material-symbols-outlined">check_circle</span>
        </div>

        <h1 class="success-title" id="success-title">تم تأكيد طلبك! </h1>
        <p class="success-subtitle" id="success-subtitle">
            شكراً لك! سيتم التواصل معك قريباً لتأكيد طلبك وإتمام عملية التسليم
        </p>

        <div class="order-number-box">
            <div class="order-number-label" id="order-num-label">رقم الطلب</div>
            <div class="order-number-value" id="order-number">PLY-XXXXXX</div>
        </div>

        <div class="order-details-grid" id="order-details">
            <!-- Rendered by JS -->
        </div>

        <!-- Order Items -->
        <div id="order-items-section" style="margin-bottom:2rem;text-align:start">
            <div style="font-size:0.85rem;font-weight:700;color:var(--text-secondary);margin-bottom:0.75rem" id="items-label">المنتجات المطلوبة</div>
            <div id="order-items-list"></div>
        </div>

        <div class="cta-group">
            <a href="/" class="btn btn-primary">
                <span class="material-symbols-outlined">home</span>
                <span id="back-btn-text">العودة للمتجر</span>
            </a>
        </div>

        <!-- Confetti -->
        <div id="confetti-container" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:var(--radius-xl)"></div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
    initLang();
    const lang = currentLang;

    const order = JSON.parse(sessionStorage.getItem('last_order') || '{}');

    if (!order.order_number) {
        window.location.href = '/';
    }

    // Apply content
    document.getElementById('order-number').textContent = order.order_number || '—';

    const labels = {
        ar: {
            title: 'تم تأكيد طلبك! 🎉',
            subtitle: 'شكراً لك! سيتم التواصل معك قريباً لتأكيد طلبك وإتمام عملية التسليم',
            order_num: 'رقم الطلب',
            customer: 'اسم العميل',
            phone: 'رقم الهاتف',
            email: 'البريد الإلكتروني',
            address: 'العنوان',
            total: 'الإجمالي',
            items: 'المنتجات المطلوبة',
            back: 'العودة للمتجر',
            qty: 'الكمية',
        },
        en: {
            title: 'Order Confirmed! 🎉',
            subtitle: "Thank you! We'll contact you soon to confirm your order and complete the delivery",
            order_num: 'Order Number',
            customer: 'Customer Name',
            phone: 'Phone Number',
            email: 'Email Address',
            address: 'Delivery Address',
            total: 'Total Amount',
            items: 'Ordered Items',
            back: 'Back to Store',
            qty: 'Qty',
        }
    };

    const l = labels[lang] || labels.ar;
    document.documentElement.lang = lang;
    document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('success-title').textContent = l.title;
    document.getElementById('success-subtitle').textContent = l.subtitle;
    document.getElementById('order-num-label').textContent = l.order_num;
    document.getElementById('items-label').textContent = l.items;
    document.getElementById('back-btn-text').textContent = l.back;

    // Details grid
    const details = [
        { label: l.customer, value: order.customer_name },
        { label: l.phone, value: order.customer_phone },
        { label: l.email, value: order.customer_email },
        { label: l.total, value: formatPrice(order.total_amount) },
    ];

    document.getElementById('order-details').innerHTML = details.map(d => `
        <div class="detail-box">
            <div class="detail-label">${d.label}</div>
            <div class="detail-value">${d.value || '—'}</div>
        </div>
    `).join('');

    // Items
    if (order.items && order.items.length > 0) {
        document.getElementById('order-items-list').innerHTML = order.items.map(item => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0;border-bottom:1px solid var(--border-light);font-size:0.875rem">
                <span>${lang === 'ar' ? item.product_name_ar : item.product_name_en} × ${item.quantity}</span>
                <span style="font-weight:700;color:var(--primary-light)">${formatPrice(item.subtotal)}</span>
            </div>
        `).join('');
    }

    // Confetti animation
    function createConfetti() {
        const container = document.getElementById('confetti-container');
        const colors = ['#7C3AED', '#F59E0B', '#10B981', '#3B82F6', '#EC4899'];
        for (let i = 0; i < 40; i++) {
            const el = document.createElement('div');
            const size = Math.random() * 8 + 4;
            el.style.cssText = `
                position: absolute;
                width: ${size}px;
                height: ${size}px;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                left: ${Math.random() * 100}%;
                top: -20px;
                border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                animation: fall ${Math.random() * 2 + 1.5}s ease ${Math.random() * 0.5}s forwards;
                opacity: 0.8;
            `;
            container.appendChild(el);
        }
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes fall {
            to { transform: translateY(${Math.random() * 200 + 200}px) rotate(${Math.random() * 720}deg); opacity: 0; }
        }
    `;
    document.head.appendChild(style);
    createConfetti();
</script>
</body>
</html>
