<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0915">
    <title>Seller sign in | PLAYORA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        :root {
            color-scheme: dark;
            --login-bg: #0a0915;
            --login-card: #171629;
            --login-card-edge: #302c4d;
            --login-field: #34324c;
            --login-muted: #9c9ab1;
            --login-faint: #74728b;
            --login-purple: #743cf1;
            --login-blue: #5147ed;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { min-height: 100%; margin: 0; }

        body {
            min-height: 100vh;
            color: #f7f6fc;
            background-color: var(--login-bg);
            background-image:
                linear-gradient(rgba(111, 94, 180, .035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(111, 94, 180, .035) 1px, transparent 1px),
                radial-gradient(ellipse at 18% 28%, rgba(75, 42, 153, .16), transparent 45%),
                radial-gradient(ellipse at 82% 74%, rgba(50, 43, 128, .12), transparent 43%);
            background-size: 172px 172px, 172px 172px, auto, auto;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            position: relative;
            overflow: hidden;
        }

        .login-page::before, .login-page::after {
            content: "";
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #8066ff;
            box-shadow: 0 0 12px 2px rgba(128, 102, 255, .55);
            pointer-events: none;
        }
        .login-page::before { top: 27%; left: 15%; }
        .login-page::after { right: 16%; bottom: 30%; }

        .login-card {
            position: relative;
            z-index: 1;
            width: min(100%, 462px);
            padding: 44px 46px 39px;
            border: 1px solid var(--login-card-edge);
            border-radius: 24px;
            background: rgba(23, 22, 41, .97);
            box-shadow: 0 28px 90px rgba(0, 0, 0, .44), inset 0 1px rgba(255, 255, 255, .025);
        }
        .login-language {
            position: absolute;
            top: 16px;
            right: 18px;
            padding: 7px 10px;
            border: 1px solid var(--login-card-edge);
            border-radius: 9px;
            color: #d5c8ff;
            background: #211d36;
            font: 600 12px Inter, sans-serif;
            cursor: pointer;
        }

        .brand-mark {
            width: 50px;
            height: 50px;
            margin: 0 auto 25px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            color: #fff;
            background: linear-gradient(145deg, #8b42ff, #6035e5);
            box-shadow: 0 8px 28px rgba(115, 58, 239, .5);
        }
        .brand-mark svg { width: 29px; height: 29px; }

        .login-title {
            margin: 0;
            color: #f6f5fb;
            text-align: center;
            font-size: clamp(27px, 6vw, 31px);
            font-weight: 700;
            letter-spacing: -.045em;
            line-height: 1.2;
        }
        .login-subtitle {
            margin: 7px 0 26px;
            color: var(--login-muted);
            text-align: center;
            font-size: 13.5px;
            line-height: 1.6;
        }

        .social-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .social-button {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 1px solid rgba(255, 255, 255, .055);
            border-radius: 13px;
            color: #e8e6f0;
            background: #34324c;
            font: 600 13px Inter, sans-serif;
            cursor: not-allowed;
            opacity: .82;
        }
        .social-button svg { width: 16px; height: 16px; }
        .social-button[aria-disabled="true"] { cursor: not-allowed; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 22px;
            color: var(--login-muted);
            font-size: 12px;
            white-space: nowrap;
        }
        .divider::before, .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: linear-gradient(90deg, transparent, #38354e 55%, #38354e);
        }
        .divider::after { transform: scaleX(-1); }

        .login-error {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 18px;
            padding: 11px 13px;
            border: 1px solid rgba(248, 113, 113, .32);
            border-radius: 11px;
            color: #ff9292;
            background: rgba(248, 113, 113, .09);
            font-size: 12px;
            line-height: 1.5;
        }

        .form-group { margin-bottom: 17px; }
        .form-label {
            display: block;
            margin-bottom: 7px;
            color: #b8b5c9;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: .035em;
            text-transform: uppercase;
        }
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            width: 18px;
            height: 18px;
            color: #aaa7bd;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .form-input {
            width: 100%;
            height: 53px;
            padding: 0 47px;
            border: 1px solid #48445f;
            border-radius: 14px;
            outline: none;
            color: #f6f5fc;
            background: var(--login-field);
            font: 400 14px Inter, sans-serif;
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }
        .form-input::placeholder { color: #858198; opacity: 1; }
        .form-input:focus {
            border-color: #8a55fa;
            background: #393650;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, .18);
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 13px;
            display: grid;
            place-items: center;
            padding: 4px;
            border: 0;
            color: #aaa7bd;
            background: transparent;
            cursor: pointer;
            transform: translateY(-50%);
        }
        .toggle-password svg { width: 18px; height: 18px; }
        .toggle-password:focus-visible, .login-button:focus-visible, .store-link:focus-visible {
            outline: 2px solid #a885ff;
            outline-offset: 3px;
        }

        .login-button {
            width: 100%;
            min-height: 53px;
            margin-top: 5px;
            border: 0;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(110deg, var(--login-purple), var(--login-blue));
            box-shadow: 0 8px 25px rgba(104, 58, 235, .38);
            font: 700 15px Inter, sans-serif;
            cursor: pointer;
            transition: filter .18s ease, transform .18s ease, box-shadow .18s ease;
        }
        .login-button:hover { filter: brightness(1.1); box-shadow: 0 10px 30px rgba(104, 58, 235, .48); }
        .login-button:active { transform: translateY(1px); }
        .login-button:disabled { cursor: wait; opacity: .75; }

        .login-footer {
            margin-top: 20px;
            color: var(--login-muted);
            text-align: center;
            font-size: 12.5px;
        }
        .store-link { color: #ae8cff; font-weight: 600; text-decoration: none; }
        .store-link:hover { color: #c8b4ff; text-decoration: underline; }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, .4);
            border-top-color: #fff;
            border-radius: 50%;
            vertical-align: middle;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 520px) {
            .login-page { padding: 20px 15px; }
            .login-card { padding: 36px 25px 30px; border-radius: 21px; }
        }
        @media (max-width: 360px) {
            .login-card { padding-right: 19px; padding-left: 19px; }
            .social-buttons { gap: 7px; }
            .social-button { gap: 6px; font-size: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <button class="login-language lang-toggle" type="button" aria-label="Change language">العربية</button>
            <div class="brand-mark" aria-label="PLAYORA logo">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <path d="m16 4 11 5.8L16 15.5 5 9.8 16 4Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
                    <path d="m5 15 11 5.8L27 15M5 20.3l11 5.8 11-5.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1 class="login-title" id="login-title" data-login-copy="title">Welcome back</h1>
            <p class="login-subtitle" data-login-copy="subtitle">Sign in to continue to your seller account</p>

            <div class="login-error" id="login-error" role="alert" aria-live="polite" hidden>
                <span aria-hidden="true">!</span>
                <span id="error-msg">Username or password is incorrect.</span>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="login-username" data-login-copy="username">Username</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 21a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        <input type="text" id="login-username" class="form-input" data-login-placeholder="usernamePlaceholder" placeholder="Enter your username" autocomplete="username" autocapitalize="none" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password" data-login-copy="password">Password</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        <input type="password" id="login-password" class="form-input" data-login-placeholder="passwordPlaceholder" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" id="toggle-pwd" class="toggle-password" aria-label="Show password" aria-pressed="false" data-login-show-password>
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-button" id="login-btn" data-login-copy="signIn">Sign in</button>
            </form>

            <div class="login-footer"><span data-login-copy="footer">Looking for great deals?</span> <a class="store-link" href="/" data-login-copy="visitStore">Visit the store</a></div>
        </section>
    </main>

    <script src="/js/api.js"></script>
    <script>
        const loginTranslations = {
            en: { title: 'Welcome back', subtitle: 'Sign in to continue to your seller account', username: 'Username', usernamePlaceholder: 'Enter your username', password: 'Password', passwordPlaceholder: 'Enter your password', signIn: 'Sign in', footer: 'Looking for great deals?', visitStore: 'Visit the store', showPassword: 'Show password', hidePassword: 'Hide password', required: 'Enter your username and password to continue.', incorrect: 'That username and password do not match a seller account.', connection: 'Could not connect to the server. Please try again.', signingIn: 'Signing in…' },
            ar: { title: 'مرحبًا بعودتك', subtitle: 'سجّل الدخول للمتابعة إلى حساب البائع', username: 'اسم المستخدم', usernamePlaceholder: 'أدخل اسم المستخدم', password: 'كلمة المرور', passwordPlaceholder: 'أدخل كلمة المرور', signIn: 'تسجيل الدخول', footer: 'تبحث عن عروض رائعة؟', visitStore: 'تفضل بزيارة المتجر', showPassword: 'إظهار كلمة المرور', hidePassword: 'إخفاء كلمة المرور', required: 'أدخل اسم المستخدم وكلمة المرور للمتابعة.', incorrect: 'اسم المستخدم أو كلمة المرور غير صحيحين.', connection: 'تعذر الاتصال بالخادم. حاول مرة أخرى.', signingIn: 'جارٍ تسجيل الدخول…' },
            fr: { title: 'Heureux de vous revoir', subtitle: 'Connectez-vous à votre compte vendeur', username: 'Nom d’utilisateur', usernamePlaceholder: 'Saisissez votre nom d’utilisateur', password: 'Mot de passe', passwordPlaceholder: 'Saisissez votre mot de passe', signIn: 'Se connecter', footer: 'À la recherche de bonnes affaires ?', visitStore: 'Visiter la boutique', showPassword: 'Afficher le mot de passe', hidePassword: 'Masquer le mot de passe', required: 'Saisissez votre nom d’utilisateur et votre mot de passe.', incorrect: 'Nom d’utilisateur ou mot de passe incorrect.', connection: 'Connexion au serveur impossible. Réessayez.', signingIn: 'Connexion…' }
        };
        let loginErrorKey = '';
        initLang();
        if (getToken()) window.location.href = '/seller/dashboard.html';

        const form = document.getElementById('login-form');
        const usernameInput = document.getElementById('login-username');
        const passwordInput = document.getElementById('login-password');
        const loginError = document.getElementById('login-error');
        const errorMessage = document.getElementById('error-msg');
        const loginButton = document.getElementById('login-btn');

        function applyLoginLanguage() {
            const copy = loginTranslations[currentLang] || loginTranslations.en;
            document.querySelectorAll('[data-login-copy]').forEach(el => { el.textContent = copy[el.dataset.loginCopy]; });
            document.querySelectorAll('[data-login-placeholder]').forEach(el => { el.placeholder = copy[el.dataset.loginPlaceholder]; });
            document.getElementById('toggle-pwd').setAttribute('aria-label', copy[passwordInput.type === 'password' ? 'showPassword' : 'hidePassword']);
            loginButton.textContent = copy.signIn;
            if (loginErrorKey) showError(loginErrorKey);
        }
        document.querySelectorAll('.lang-toggle').forEach(button => button.addEventListener('click', nextLang));
        document.addEventListener('langChange', applyLoginLanguage);
        applyLoginLanguage();

        function showError(key) {
            loginErrorKey = key;
            errorMessage.textContent = (loginTranslations[currentLang] || loginTranslations.en)[key];
            loginError.hidden = false;
        }

        document.getElementById('toggle-pwd').addEventListener('click', function () {
            const showing = passwordInput.type === 'password';
            passwordInput.type = showing ? 'text' : 'password';
            this.setAttribute('aria-pressed', String(showing));
            this.setAttribute('aria-label', (loginTranslations[currentLang] || loginTranslations.en)[showing ? 'hidePassword' : 'showPassword']);
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginErrorKey = '';
            loginError.hidden = true;

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            if (!username || !password) {
                showError('required');
                return;
            }

            loginButton.disabled = true;
            loginButton.innerHTML = `<span class="spinner" aria-hidden="true"></span> ${(loginTranslations[currentLang] || loginTranslations.en).signingIn}`;

            try {
                const response = await api.login(username, password);
                if (response.success) {
                    setToken(response.token);
                    setSeller(response.seller);
                    window.location.href = '/seller/dashboard.html';
                    return;
                }
                showError('incorrect');
            } catch (error) {
                showError('connection');
            }

            loginButton.disabled = false;
            loginButton.textContent = (loginTranslations[currentLang] || loginTranslations.en).signIn;
        });
    </script>
</body>

</html>
